spring.application.name=TiendaBellaAfrodita

# Configuracion de Conexion MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bella_afrodita_db?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=38216639
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Optimizado para VPS de Bajos Recursos (Ahorro de RAM del motor MySQL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Compresión HTTP GZIP (Ahorro de hasta 75% en ancho de banda y menor consumo de red)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Cache-Control de Recursos Estáticos Spring (30 días para imágenes/assets)
spring.web.resources.cache.cachecontrol.max-age=2592000s
spring.web.resources.cache.cachecontrol.cache-public=true

# Configuracion de Archivos y Subida de Imagenes
file.upload-dir=uploads
file.images-dir=src/main/resources/static/images
file.thumbnails-dir=thumbnails
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# Dominio base canonico para Social Previews local
app.base-url=${APP_BASE_URL:http://localhost:8080}
