spring.application.name=TiendaBellaAfrodita

# Configuracion de Conexion MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/bella_afrodita_db?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=38216639
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool (Eficiente)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuracion de Archivos y Subida de Imagenes
file.upload-dir=uploads
file.images-dir=src/main/resources/static/images
file.thumbnails-dir=thumbnails
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# Dominio base canonico para Social Previews local
app.base-url=${APP_BASE_URL:http://localhost:8080}
