<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - My Bella Afrodita</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/alexanderbaez/my-bella-afrodita-web/master/images/LOGO.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-ivory: #FAF9F6;
            --text-charcoal: #121212;
            --gold-champagne: #C5A880;
            --gold-dark: #A4865E;
            --border-gold-subtle: rgba(197, 168, 128, 0.35);
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #FAF9F6 0%, #F5F3EF 50%, #ECE9E2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .font-playfair, .font-serif {
            font-family: 'Cormorant Garamond', Georgia, serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 4px;
            border: 1px solid var(--border-gold-subtle);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.06);
            padding: 44px 38px;
            animation: fadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            height: 60px;
            width: auto;
            object-fit: contain;
            margin-bottom: 14px;
        }

        .form-control:focus {
            border-color: var(--gold-champagne);
            box-shadow: 0 0 0 0.2rem rgba(197, 168, 128, 0.2);
        }

        .btn-luxury-login {
            background-color: var(--text-charcoal);
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 13px;
            border-radius: 2px;
            border: 1px solid var(--text-charcoal);
            transition: all 0.3s ease;
        }

        .btn-luxury-login:hover {
            background-color: transparent;
            color: var(--text-charcoal);
            border-color: var(--gold-champagne);
            box-shadow: 0 6px 18px rgba(197, 168, 128, 0.2);
            transform: translateY(-1px);
        }

        .back-link {
            color: #706E6B;
            text-decoration: none;
            font-size: 0.78rem;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--gold-dark);
        }
    </style>
</head>

<body>
    <div class="login-card text-center">
        <!-- Logo y Marca -->
        <img src="https://raw.githubusercontent.com/alexanderbaez/my-bella-afrodita-web/master/images/LOGO.png" alt="My Bella Afrodita" class="login-logo">
        <h2 class="h4 font-playfair fw-bold text-dark mb-1">Acceso Administrativo</h2>
        <p class="text-muted small mb-4" style="letter-spacing: 0.5px;">Panel de Control · Backoffice</p>

        <!-- Formulario -->
        <form id="form-login" onsubmit="ejecutarLogin(event)" class="text-start">
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">Email Corporativo</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control border-start-0" required placeholder="admin@bellafrodita.com" autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control border-start-0" required placeholder="••••••••" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-luxury-login w-100 shadow-sm" id="btn-login">
                <i class="fas fa-sign-in-alt me-1.5"></i> Ingresar al Panel
            </button>
        </form>

        <hr class="my-4 opacity-10">

        <div>
            <a href="/productos.html" class="back-link">
                <i class="fas fa-arrow-left me-1"></i> Volver a la Tienda Pública
            </a>
        </div>
    </div>

    <script>
        const LOGIN_URL = '/api/auth/login';

        async function ejecutarLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-login');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Verificando...';

            try {
                const res = await fetch(LOGIN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.authenticated) {
                    sessionStorage.setItem('myBellaAdminUser', JSON.stringify(data));

                    Swal.fire({
                        icon: 'success',
                        title: '¡Bienvenido!',
                        text: `Acceso concedido para ${data.nombre || data.email}`,
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = '/admin.html';
                    });
                } else {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Acceso Denegado',
                    text: error.message || 'El email o la contraseña no coinciden con un usuario activo.',
                    confirmButtonColor: '#1a1a1a'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-1.5"></i> Ingresar al Panel';
            }
        }
    </script>
</body>

</html>
