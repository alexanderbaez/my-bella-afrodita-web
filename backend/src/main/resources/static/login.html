<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Privado - Mi Bella Afrodita</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/alexanderbaez/my-bella-afrodita-web/master/images/LOGO.png">

    <!-- Framework & Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --bg-ivory: #FAF9F6;
            --text-charcoal: #121212;
            --text-secondary: #706E6B;
            --gold-champagne: #C5A880;
            --gold-dark: #A4865E;
            --gold-light: #F4EBE1;
            --border-champagne: rgba(197, 168, 128, 0.38);
            --border-champagne-light: rgba(197, 168, 128, 0.2);
            --velvet-red-bg: rgba(142, 26, 39, 0.05);
            --velvet-red-border: rgba(184, 51, 66, 0.3);
            --velvet-red-text: #8A1C28;
            --velvet-red-icon: #A92332;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-ivory);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(197, 168, 128, 0.09) 0%, transparent 60%),
                radial-gradient(circle at 10% 85%, rgba(197, 168, 128, 0.05) 0%, transparent 45%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text-charcoal);
            position: relative;
        }

        /* Tipografía Editorial */
        .font-editorial {
            font-family: 'Cormorant Garamond', Georgia, serif;
            letter-spacing: -0.01em;
        }

        /* Tarjeta Centrada de Corte Sastre */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: #FFFFFF;
            border-radius: 6px;
            border: 1px solid var(--border-champagne);
            box-shadow: 
                0 24px 60px rgba(0, 0, 0, 0.04), 
                0 6px 18px rgba(197, 168, 128, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            padding: 46px 40px;
            position: relative;
            animation: cardEntrance 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Micro-shake sutil para feedback de error */
        .shake-subtle {
            animation: shakeKeyframe 0.4s ease-in-out;
        }

        @keyframes shakeKeyframe {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* Logo de Marca */
        .brand-logo-wrap {
            margin-bottom: 18px;
            display: inline-block;
        }

        .login-logo {
            height: 58px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.04));
            transition: transform 0.3s ease;
        }

        .login-logo:hover {
            transform: scale(1.03);
        }

        /* Eyebrow */
        .atelier-eyebrow {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 2.8px;
            color: var(--gold-dark);
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
        }

        /* Encabezado */
        .login-title {
            font-size: 2.15rem;
            font-weight: 600;
            color: var(--text-charcoal);
            line-height: 1.15;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 0.82rem;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            margin-bottom: 26px;
        }

        /* Etiquetas de Formulario */
        .form-label-atelier {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            color: #383431;
            margin-bottom: 7px;
            display: block;
        }

        /* Inputs de Entrada */
        .input-group-atelier {
            border: 1px solid #DCD7CE;
            border-radius: 4px;
            overflow: hidden;
            background-color: #FFFFFF;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .input-group-atelier:focus-within {
            border-color: var(--gold-champagne);
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.18);
        }

        .input-group-atelier .input-group-text {
            background-color: transparent;
            border: none;
            color: #8C827A;
            padding: 12px 14px;
            font-size: 0.9rem;
        }

        .input-group-atelier .form-control {
            border: none;
            font-size: 0.88rem;
            padding: 12px 14px 12px 0;
            color: var(--text-charcoal);
            background-color: transparent;
            box-shadow: none !important;
        }

        .input-group-atelier .form-control::placeholder {
            color: #AFAAA3;
            font-weight: 400;
        }

        /* Botón de alternancia de contraseña */
        .btn-toggle-pwd {
            background: transparent;
            border: none;
            color: #8C827A;
            padding: 0 14px;
            cursor: pointer;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-toggle-pwd:hover,
        .btn-toggle-pwd:focus {
            color: var(--gold-dark);
            outline: none;
        }

        /* Checkbox Estilizado Remember Me */
        .custom-remember-wrap {
            margin-top: 14px;
            margin-bottom: 22px;
        }

        .custom-remember-check {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            margin: 0;
        }

        .custom-remember-check .form-check-input {
            width: 17px;
            height: 17px;
            margin: 0;
            border: 1.5px solid #BCB3A4;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .custom-remember-check .form-check-input:checked {
            background-color: var(--gold-dark);
            border-color: var(--gold-dark);
            box-shadow: 0 0 0 2px rgba(197, 168, 128, 0.2);
        }

        .custom-remember-check .form-check-input:focus {
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.25);
            border-color: var(--gold-champagne);
        }

        .custom-remember-check .form-check-label {
            font-size: 0.79rem;
            color: #4A4641;
            font-weight: 500;
            letter-spacing: 0.2px;
            cursor: pointer;
        }

        /* Feedback de Error en Rojo Terciopelo */
        .login-feedback {
            background-color: var(--velvet-red-bg);
            border: 1px solid var(--velvet-red-border);
            color: var(--velvet-red-text);
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 0.81rem;
            line-height: 1.4;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .login-feedback i {
            color: var(--velvet-red-icon);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .login-feedback.show {
            display: flex !important;
            animation: fadeInFeedback 0.3s ease forwards;
        }

        @keyframes fadeInFeedback {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Botón de Ingreso */
        .btn-luxury-login {
            background-color: var(--text-charcoal);
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.77rem;
            padding: 14px;
            border-radius: 3px;
            border: 1px solid var(--text-charcoal);
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(18, 18, 18, 0.12);
        }

        .btn-luxury-login:hover:not(:disabled) {
            background-color: #262422;
            border-color: var(--gold-champagne);
            color: #FFFFFF;
            box-shadow: 0 6px 20px rgba(197, 168, 128, 0.28);
            transform: translateY(-1px);
        }

        .btn-luxury-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-luxury-login:disabled {
            background-color: #383431;
            opacity: 0.85;
            cursor: not-allowed;
            border-color: #383431;
        }

        .btn-luxury-success {
            background-color: #1F4529 !important;
            border-color: #1F4529 !important;
            color: #FFFFFF !important;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.77rem;
            padding: 14px;
            border-radius: 3px;
            width: 100%;
        }

        /* Separador y Link Inferior */
        .login-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-champagne-light), transparent);
            margin: 28px 0 20px 0;
            border: none;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.78rem;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.2s ease, transform 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: var(--gold-dark);
            transform: translateX(-2px);
        }

        /* Micro-insignia de seguridad en pie de tarjeta */
        .security-badge {
            font-size: 0.68rem;
            color: #9C958C;
            letter-spacing: 0.5px;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>

<body>
    <div class="login-card text-center">
        <!-- Logo y Monograma -->
        <div class="brand-logo-wrap">
            <a href="/productos.html" title="Mi Bella Afrodita">
                <img src="https://raw.githubusercontent.com/alexanderbaez/my-bella-afrodita-web/master/images/LOGO.png" alt="Mi Bella Afrodita" class="login-logo">
            </a>
        </div>

        <!-- Encabezado Editorial -->
        <span class="atelier-eyebrow">Panel de Administración</span>
        <h1 class="login-title font-editorial">Acceso Privado</h1>
        <p class="login-subtitle">Gestión de catálogo, inventario y pedidos</p>

        <!-- Cuadro de Feedback de Error (Rojo Terciopelo) -->
        <div id="login-feedback" class="login-feedback d-none" role="alert">
            <i class="fas fa-circle-exclamation me-2"></i>
            <span id="login-feedback-text"></span>
        </div>

        <!-- Formulario de Autenticación -->
        <form id="form-login" class="text-start" novalidate>
            <!-- Email Corporativo -->
            <div class="mb-3">
                <label for="email" class="form-label-atelier">Email Corporativo</label>
                <div class="input-group input-group-atelier">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="email" class="form-control" required placeholder="lopezandre26@gmail.com" autocomplete="email" spellcheck="false">
                </div>
            </div>

            <!-- Contraseña con Alternancia de Visibilidad -->
            <div class="mb-1">
                <label for="password" class="form-label-atelier">Clave de Acceso</label>
                <div class="input-group input-group-atelier">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" required placeholder="•••••••••" autocomplete="current-password">
                    <button type="button" id="btn-toggle-password" class="btn-toggle-pwd" title="Mostrar contraseña" aria-label="Mostrar u ocultar contraseña">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <!-- Checkbox Recordar Sesión -->
            <div class="custom-remember-wrap">
                <div class="custom-remember-check">
                    <input class="form-check-input" type="checkbox" id="remember-me">
                    <label class="form-check-label" for="remember-me">
                        Recordar sesión en este equipo
                    </label>
                </div>
            </div>

            <!-- Botón de Ingreso -->
            <button type="submit" class="btn btn-luxury-login" id="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i> Ingresar al Panel
            </button>
        </form>

        <hr class="login-divider">

        <!-- Enlaces y Seguridad -->
        <div class="d-flex flex-column align-items-center gap-1">
            <a href="/productos.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Volver a la Tienda Pública
            </a>
            <div class="security-badge">
                <i class="fas fa-shield-halved"></i> Conexión Cifrada SSL &bull; Sesión Protegida
            </div>
        </div>
    </div>

    <!-- Bootstrap & Lógica de Login -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
