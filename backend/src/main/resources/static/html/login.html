<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo - My Bella Afrodita</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/alexanderbaez/my-bella-afrodita-web/master/images/LOGO.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --brand-primary: #B794C9;
            --brand-accent: #DDA0C2;
            --color-pasión: #8e62a3;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #FDF4FF 0%, #E7D8E6 50%, #F4F1F4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 45px rgba(142, 98, 163, 0.15);
            padding: 40px 36px;
            animation: fadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            height: 65px;
            width: auto;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .form-control:focus {
            border-color: var(--color-pasión);
            box-shadow: 0 0 0 0.2rem rgba(183, 148, 201, 0.25);
        }

        .btn-luxury-login {
            background-color: #1a1a1a;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-size: 0.75rem;
            padding: 12px;
            border-radius: 4px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-luxury-login:hover {
            background-color: var(--color-pasión);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(142, 98, 163, 0.3);
        }

        .back-link {
            color: #777;
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--color-pasión);
        }
    </style>
</head>

<body>
    <div class="login-card text-center">
        <!-- Logo y Marca -->
        <img src="https://raw.githubusercontent.com/alexanderbaez/my-bella-afrodita-web/master/images/LOGO.png" alt="My Bella Afrodita" class="login-logo">
        <h2 class="h4 font-playfair fw-bold text-dark mb-1">Acceso Administrativo</h2>
        <p class="text-muted small mb-4" style="letter-spacing: 0.5px;">Panel de Control · Backoffice</p>

        <!-- Formulario -->
        <form id="form-login" onsubmit="ejecutarLogin(event)" class="text-start">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-user-circle"></i></span>
                    <input type="text" id="username" class="form-control border-start-0" required placeholder="admin" autocomplete="username">
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-bold text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.5px;">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control border-start-0" required placeholder="••••••••" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-luxury-login w-100 shadow-sm" id="btn-login">
                <i class="fas fa-sign-in-alt me-1.5"></i> Ingresar al Panel
            </button>
        </form>

        <hr class="my-4 opacity-10">

        <div>
            <a href="./productos.html" class="back-link">
                <i class="fas fa-arrow-left me-1"></i> Volver a la Tienda Pública
            </a>
        </div>
    </div>

    <script>
        const AUTH_VERIFY_URL = '/api/auth/verify';

        async function ejecutarLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-login');
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            if (!user || !pass) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Verificando...';

            const token = 'Basic ' + btoa(`${user}:${pass}`);

            try {
                const res = await fetch(AUTH_VERIFY_URL, {
                    headers: { 'Authorization': token }
                });

                if (res.ok) {
                    sessionStorage.setItem('myBellaAdminAuth', token);
                    sessionStorage.setItem('myBellaAdminUser', user);

                    Swal.fire({
                        icon: 'success',
                        title: '¡Bienvenido!',
                        text: `Acceso concedido para ${user}`,
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = './admin.html';
                    });
                } else {
                    throw new Error('Credenciales incorrectas');
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Acceso Denegado',
                    text: 'El usuario o la contraseña no coinciden con las credenciales registradas.',
                    confirmButtonColor: '#1a1a1a'
                });
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt me-1.5"></i> Ingresar al Panel';
            }
        }
    </script>
</body>

</html>
