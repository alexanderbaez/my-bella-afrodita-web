# ==============================================================================
# PERFIL DE PRODUCCION - LENCERIA MI BELLA AFRODITA (ULTRA-LOW RESOURCE FOOTPRINT)
# Activacion: -Dspring.profiles.active=prod o export SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

spring.application.name=TiendaBellaAfrodita

# Configuracion de Conexion MySQL con Variables de Entorno Seguras
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bella_afrodita_db?useSSL=false&serverTimezone=America/Argentina/San_Juan}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Ultraligero (Ahorro critico de RAM y CPU en VPS compartido)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=BellaAfroditaHikariPool

# JPA / Hibernate en Produccion (Sin Open-in-View para liberar conexiones de inmediato)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Embedded Tomcat Optimizado (Limitacion estricta de hilos de trabajo y conexiones)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=20
server.tomcat.connection-timeout=20000
server.tomcat.mbeanregistry.enabled=false

# Optimizacion de Memoria Heap de Spring Boot (Desactivacion de JMX para ahorrar 15-25 MB)
spring.jmx.enabled=false

# Rutas Externas del Sistema de Archivos para Servir Assets fuera del Classpath
file.upload-dir=${UPLOAD_DIR:/opt/bella-afrodita/uploads}
file.images-dir=${STATIC_IMAGES_DIR:/opt/bella-afrodita/images}
file.thumbnails-dir=${THUMBNAILS_DIR:/opt/bella-afrodita/thumbnails}

# Limites de Subida de Archivos
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# Seguridad de Sesion
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Dominio base canonico para Social Previews (OpenGraph / WhatsApp)
app.base-url=${APP_BASE_URL:https://bellaafrodita.baezpos.com}
