# ==============================================================================
# PERFIL DE PRODUCCION - LENCERIA MI BELLA AFRODITA
# Activacion: -Dspring.profiles.active=prod o export SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

spring.application.name=TiendaBellaAfrodita

# Configuracion de Conexion MySQL con Variables de Entorno Seguras
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bella_afrodita_db?useSSL=false&serverTimezone=America/Argentina/San_Juan}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate en Produccion (Valida esquema existente sin alterar tablas)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Limites de Subida de Archivos
file.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# Seguridad de Sesion
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
